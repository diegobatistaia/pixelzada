quality_gate:
  min_independent_sources: 2
  # Herdado do Cortexplor: o anúncio que a própria empresa publica no canal
  # oficial dela (fonte `kind: primary`, ex.: Rockstar, PlayStation Blog) basta
  # sozinho para a matéria "a empresa anunciou X". A matéria marca `fonte_unica: anuncio_oficial`,
  # atribui tudo à empresa e mostra um aviso próprio no rodapé. Qualquer
  # outra notícia continua exigindo duas fontes independentes.
  official_announcement_alone: true
  word_count: {min: 600, max: 1000}
  # Similaridade maxima com o texto-fonte (shingles de 5 palavras).
  max_source_similarity: 0.18
  # Maior trecho literal permitido em comum com uma fonte, em palavras.
  max_verbatim_run: 8
  meta_description_range: [150, 160]
  require:
    - meta_description
    - image_alt
    - schema_news_article
    - sources_cited
    - h1_present
    - internal_links
  min_internal_links: 1

images:
  # SEM IMAGEM POR ENQUANTO. Nao ha chave do Unsplash/Pexels, e a identidade
  # pede o trailer ou o print oficial dentro da arte, nao foto de banco. Com
  # provider: none o gate nao exige imagem e os templates publicam so texto.
  # Para voltar ao banco de fotos: provider: unsplash e os secrets
  # UNSPLASH_ACCESS_KEY / PEXELS_API_KEY.
  provider: none
  fallback_provider: pexels
  orientation: landscape
  attribution_required: true
  query_suffix: video game

