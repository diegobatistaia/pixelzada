# Motor de pesquisa de vídeos dos concorrentes: configuração da marca.
#
# O motor (scripts/social/pesquisa.py) é o mesmo para qualquer marca. Para usar
# em outro perfil (ex.: Cortexplor), copie este arquivo, troque os campos e
# rode com --config <arquivo>.

marca: Pixelzada
conta: pixelzada.br               # perfil do Instagram ligado à Página do Facebook
segredo: META_TOKEN_PIXELZADA     # nome do secret no GitHub com a chave da API oficial
api: https://graph.facebook.com/v23.0

pasta: social/pesquisa            # onde ficam coletas, listas e o histórico
entrada: social/reels/entrada     # onde caem os vídeos escolhidos (antes da moldura)

janela_horas: 72                  # só entram vídeos publicados nas últimas X horas
posts_por_perfil: 30              # quantos posts recentes ler de cada perfil
lista_tamanho: 30                 # quantos vídeos vão na lista do dia
max_por_perfil: 4                 # no máximo X vídeos do mesmo perfil na lista
minimo_vezes_media: 1.0           # vídeo precisa ir pelo menos X vezes a média do perfil
horarios: ["10:00", "12:00", "14:00", "16:00", "18:00", "20:00"]

# Piso dos 6 Reels por dia: em toda rodada o robô confere a fila de hoje e dos
# próximos 2 dias e baixa sozinho os melhores da lista até cobrir os horários
# vazios (scripts/social/montagem.py monta e agenda). Os números que o Diego
# escolher continuam valendo e entram antes.
automatico:
  max_por_rodada: 12

# Vídeo sem arquivo pela API oficial: o robô tenta o yt-dlp (grátis, sem login).

# Legenda com estas palavras não vira Reel (propaganda, venda, sorteio).
bloquear: ["comenta quero", "desconto", "cupom", "#publi", "publicidade", "parceria paga",
           "disney+", "assine", "sorteio", "link na bio", "frete grátis", "compre",
           "free trial", "play now", "available now", "out now", "pre-order", "pré-venda",
           "oferta", "#howto", "#dica", "configurações", "season 1", "battle pass"]

# Reserva (vídeos abaixo da média, só quando a lista não basta): mínimo de X vezes
# a média, e perfis com "reserva: false" ficam de fora (conteúdo que não vira meme).
reserva_minimo: 0.6

# Coletas por dia (horário de Brasília). Antes do lançamento só a das 6h.
coletas: ["06:00"]

lancamento:
  desde: "2026-11-19"             # GTA 6
  coletas: ["06:00", "11:00", "15:00", "19:00"]
  janela_horas: 48
  lista_tamanho: 40
  pesos: {gta6: 5}

# Temas: palavras na legenda que identificam o jogo, e o peso na escolha.
temas:
  gta6:
    nome: GTA 6
    palavras: ["gta 6", "gta6", "gta vi", "gtavi", "vice city", "leonida", "lucia", "jason duval"]
    peso: 2
  battlefield6:
    nome: Battlefield 6
    palavras: ["battlefield 6", "battlefield6", "bf6", "battlefield"]
    peso: 1.3
  forza6:
    nome: Forza Horizon 6
    palavras: ["forza horizon 6", "forzahorizon6", "fh6", "forza"]
    peso: 1.3
  games:
    nome: o universo dos games
    palavras: []
    peso: 1

# Perfis concorrentes. "tema" vale quando a legenda não diz o jogo.
# Lista inicial tirada da estratégia de Instagram (17/10); o teste mostra quais
# a API enxerga (só perfis profissionais) e os que falharem saem.
