# ---------------------------------------------------------------------------
# FICHA DA MARCA NOVA (modelo para replicar o sistema da Pixelzada)
#
# Vira o marca.yaml do repositório modelo (diegobatistaia/marca-modelo).
#
# Como usar: copie este arquivo para o repositório novo, preencha os campos
# e peça ao Claude: "monte o sistema a partir da ficha docs/replicar/marca-modelo.yaml".
# Ele troca tudo o que é da Pixelzada pelo que está aqui (veja o guia
# docs/replicar/GUIA-REPLICAR.md, Apêndice A, para a lista de arquivos).
#
# Campo em branco = o Claude pergunta antes de montar.
# NUNCA escreva chave/token/senha aqui: chaves vão só em GitHub > Secrets.
# ---------------------------------------------------------------------------

marca:
  nome: ""                 # ex.: Cortexplor
  artigo: ""               # "a" ou "o" (a Pixelzada / o Cortexplor)
  slogan: ""               # ex.: Notícias de Games
  descricao: ""            # 1 frase para o Google e para a página "Sobre"
  tom: ""                  # ex.: solto, com meme no gancho e fato checado no corpo
  idioma: pt
  nicho: ""                # games | gta6 | carros | tecnologia | financas | outro
  # Texto que o robô põe sozinho na bio, nas legendas e no rodapé do site.
  # OBRIGATÓRIO no mercado financeiro:
  #   "Conteúdo informativo. Não é recomendação de investimento."
  aviso_legal: ""
  # Dar crédito ao perfil de origem nos Reels de terceiros (recomendado nas marcas novas).
  credito_origem: true
  # Marcas do mesmo assunto (ex.: Pixelzada e a marca de GTA 6) consultam o histórico
  # uma da outra para não postar o mesmo vídeo. Lista de repositórios, ex.: [pixelzada].
  nao_repetir_com: []

site:
  ligar_site: true         # false = só Instagram/Reels, sem site de matérias
  dominio: ""              # ex.: novosite.com.br
  dominio_extra: ""        # ex.: novosite.com (redireciona para o principal)
  email: ""                # ex.: contato@novosite.com.br
  materias_por_dia: 8

hospedagem:                # Hostinger (hPanel > Sites > <domínio> > Avançado > Acesso SSH)
  host: ""                 # IP que aparece no hPanel (pode mudar com o tempo!)
  porta: 65002
  usuario: ""              # ex.: u433721675 (mesma conta dos outros sites serve)

instagram:
  usuario: ""              # sem @, ex.: novomarca.br
  # Nomes dos secrets no GitHub. Padrão: <NOME>_<MARCA EM MAIÚSCULAS>.
  segredo_publicar: ""     # ex.: INSTAGRAM_TOKEN_NOVAMARCA (chave de login do Instagram)
  segredo_pesquisa: ""     # ex.: META_TOKEN_NOVAMARCA (chave da Página do Facebook, nunca expira)
  segredo_telegram: ""     # ex.: TELEGRAM_TOKEN_NOVAMARCA (chave do robô do BotFather)
  app_meta_pesquisa: ""    # ex.: "Novamarca Pesquisa" (app novo, um por marca)
  pagina_facebook: ""      # nome da Página do Facebook ligada ao Instagram
  hashtag_marca: ""        # ex.: "#novamarca"

identidade:
  # Pasta com logo (SVG/PNG), cores e fontes. Pode ser feita pelo Claude do zero.
  cor_fundo: ""            # Pixelzada: #0B0A10 (noite)
  cor_marca: ""            # Pixelzada: #C6FF1A (lima)
  cor_destaque: ""         # Pixelzada: #FF3D8B (magenta)
  fonte_titulo: ""         # Pixelzada: Anton
  fonte_texto: ""          # Pixelzada: Archivo
  fonte_etiqueta: ""       # Pixelzada: Silkscreen

reels:
  por_dia: 6               # quantos Reels por dia (a Pixelzada começou com 6)
  horarios: ["10:00", "12:00", "14:00", "16:00", "18:00", "20:00"]   # horário de Brasília
  # Frase de baixo do Reel (regra do Diego): só chama para seguir, sem frase inventada.
  cta_modelo: "Essa é a página pra seguir e acompanhar {assunto}"
  cta_generico: ""         # ex.: "o universo dos games" / "a tecnologia"

carrosseis:
  ligar: true
  horarios: ["09:00", "11:00", "13:00", "15:00", "17:00", "19:00", "21:00"]
  story_junto: ""          # "todos", "nenhum" ou o tema que leva Story (Pixelzada: só GTA 6)

pesquisa:                  # motor que acha vídeos dos concorrentes
  coleta: ["06:00"]
  janela_horas: 72
  # Temas: palavras na legenda que identificam o assunto e o peso na escolha.
  temas:
    - {chave: "", nome: "", palavras: [], peso: 1}
  # Perfis concorrentes (só perfis profissionais aparecem na API).
  concorrentes:
    - {perfil: "", tema: ""}
  bloquear: ["publicidade", "#publi", "cupom", "sorteio", "link na bio"]
  # Mercado financeiro: somar ["curso", "mentoria", "sinal", "lucro garantido",
  #   "renda passiva", "day trade", "compre agora"]

rotinas:                   # criadas em claude.ai/code/routines
  redacao: true            # matérias do site + pautas dos carrosséis
  lista_diaria: "06:20"    # Claude manda a lista de vídeos e você responde com números
  conferencia_posts: true  # confere cada post 5 min depois do horário
  vigia_erros: true        # confere falhas do GitHub de hora em hora
