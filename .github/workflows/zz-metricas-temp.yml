name: TEMP métricas Instagram
on:
  push:
    branches: [claude/project-thread-wfj08t]
    paths: [tmp-metricas/puxar.py, .github/workflows/zz-metricas-temp.yml]
permissions:
  contents: write
jobs:
  puxar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python tmp-metricas/puxar.py
        env:
          INSTAGRAM_TOKEN_PIXELZADA: ${{ secrets.INSTAGRAM_TOKEN_PIXELZADA }}
      - run: |
          git config user.name pixelzada-bot; git config user.email bot@pixelzada.com.br
          git add tmp-metricas/metricas.json; git commit -m "temp: métricas" ; git push
