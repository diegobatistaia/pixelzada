name: Amostras de voz (Guia Vice City)

on:
  push:
    branches: ["claude/**"]
    paths: ["scripts/longo/vozes_amostra.txt", "scripts/longo/vozes_amostra.py", ".github/workflows/amostras-voz.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vozes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GEMINI_API_KEY_GRATIS: ${{ secrets.GEMINI_API_KEY_GRATIS }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
      - run: python -u -m scripts.longo.vozes_amostra scripts/longo/vozes_amostra.txt
      - name: Guardar no ramo
        if: always()
        run: |
          git config user.name "pixelzada-bot"
          git config user.email "bot@pixelzada.com.br"
          git add -f previas/longo/amostras-voz
          git diff --cached --quiet && exit 0
          git commit -q -m "amostras de voz [skip ci]"
          for i in 1 2 3 4; do git pull --rebase -q origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME" && exit 0; sleep $((i*5)); done
          exit 1
