name: Capas

# Refaz o recorte das capas publicadas a partir da imagem original (sem cortar
# rosto) e troca a capa genérica pela imagem de divulgação das fontes. Roda na
# mão (Actions > Capas > Run workflow); precisa de internet.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalizar
  cancel-in-progress: false

jobs:
  capas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Refazer as capas e o site, commitar
        # A redação e as outras rotinas commitam no main enquanto isto roda
        # (foi o que derrubou a execução #3: "rejected, fetch first"). Se o
        # push for recusado, pega o main novo e refaz tudo em cima dele.
        run: |
          git config user.name "pixelzada-bot"
          git config user.email "bot@pixelzada.com.br"
          for tentativa in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python -m scripts.tools.recortar_capas
            python -m scripts.tools.capas_oficiais
            python -m scripts.pipeline.run build
            git add -A
            if git diff --cached --quiet; then
              echo "Nada mudou."
              exit 0
            fi
            git commit -m "site: capas oficiais"
            if git push origin HEAD:main; then exit 0; fi
            sleep 10
          done
          exit 1

  publicar:
    needs: capas
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
