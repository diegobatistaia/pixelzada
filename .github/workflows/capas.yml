name: Capas do YouTube (teste)

# Gera as capas A/B/C dos vídeos longos com as imagens oficiais em resolução cheia
# e grava em previas/longo/capas/. NÃO publica nada.
on:
  push:
    branches: ["claude/**"]
    paths: ["scripts/longo/capas_teste.py", ".github/workflows/capas.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capas:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Ferramentas
        run: |
          pip install -q pyyaml pillow numpy
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu > /dev/null
          curl -sfL -o trabalho/florida.geojson --create-dirs https://raw.githubusercontent.com/glynnbird/usstatesgeojson/master/florida.geojson || true
      - name: Capas
        run: python -u -m scripts.longo.capas_teste previas/longo/capas scripts/longo/capas/g5-michael.png
      - name: Guardar no ramo
        run: |
          git config user.name "pixelzada-bot"
          git config user.email "bot@pixelzada.com.br"
          git add -f previas/longo/capas
          git diff --cached --quiet && exit 0
          git commit -q -m "longo: capas do YouTube [skip ci]"
          for i in 1 2 3 4; do { git pull --rebase -X theirs -q origin "$GITHUB_REF_NAME" || { git rebase --abort; false; }; } && git push -q origin "HEAD:$GITHUB_REF_NAME" && exit 0; sleep $((i*5)); done
          exit 1
