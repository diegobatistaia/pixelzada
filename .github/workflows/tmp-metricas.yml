name: Temp métricas dashboard
on:
  push:
    branches: [claude/project-thread-t5mg1z]
    paths: [".github/workflows/tmp-metricas.yml", "tmp_metricas/puxar.py"]
permissions:
  contents: write
jobs:
  puxar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - env:
          INSTAGRAM_TOKEN_PIXELZADA: ${{ secrets.INSTAGRAM_TOKEN_PIXELZADA }}
        run: python -m tmp_metricas.puxar
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898237+github-actions[bot]@users.noreply.github.com"
          git add tmp_metricas/metricas-2026-10-17.json
          git commit -m "temp: métricas para o dashboard"
          git push
