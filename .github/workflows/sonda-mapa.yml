name: Sonda vídeo do mapa (temporária)
# Procura o mapa de satélite do GTA V em alta. Não publica nada.
on:
  push:
    branches: ["claude/project-thread-bbktm1"]
    paths: [".github/workflows/sonda-mapa.yml", "scripts/mapa/sonda.txt"]
permissions:
  contents: write
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: |
          P=previas/mapa/sonda2; mkdir -p $P
          for r in CreepPork/GTAV-Maps Flamm64/GTA-V-World-Map gta5-map/gta5-map.github.io VIRUXE/gtav-map-tiles; do
            d=/tmp/$(basename $r)
            git clone -q --depth 1 https://github.com/$r $d || continue
            echo "== $r" >> $P/arvore.txt
            (cd $d && find . -path ./.git -prune -o -type d -print | awk -F/ 'NF<=5' | head -80) >> $P/arvore.txt
            (cd $d && find . -path ./.git -prune -o -type f -size +1M -printf "%s %p\n" | sort -rn | head -30) >> $P/arvore.txt
          done
          git config user.name pixelzada-bot; git config user.email bot@pixelzada.com.br
          git add -f $P; git commit -qm "sonda mapa 2 [skip ci]" || exit 0
          git push -q origin HEAD:$GITHUB_REF_NAME
