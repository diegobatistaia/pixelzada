name: Vídeo longo narrado (prévia)

# Monta o vídeo narrado do YouTube (scripts/longo/narrado.py) e grava no próprio ramo:
# prévia 720p, capa, descrição e o vídeo final 1080p em partes de 90 MB (limite do GitHub).
# NÃO publica nada.
on:
  push:
    branches: ["claude/**"]
    paths: ["scripts/longo/narrado.py", "scripts/longo/narrados/**", "scripts/longo/doc/**", ".github/workflows/narrado.yml"]
  workflow_dispatch:
    inputs:
      episodio:
        description: "slug (arquivo em scripts/longo/narrados/)"
        default: leonida-e-a-florida

permissions:
  contents: write

concurrency:
  group: narrado-${{ github.ref }}
  cancel-in-progress: true

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EPISODIO: ${{ github.event.inputs.episodio || 'leonida-e-a-florida' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TTS_MODELO: gemini-3.1-flash-tts-preview
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Ferramentas
        run: |
          pip install -q pyyaml pillow edge-tts
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu > /dev/null
          ffmpeg -hide_banner -filters | grep -q subtitles && echo "libass ok"
      - name: Material oficial e mapa
        timeout-minutes: 25
        run: |
          python -u -m scripts.longo.oficial --episodio "scripts/longo/narrados/$EPISODIO.json"
          curl -sfL -o trabalho/florida.geojson https://raw.githubusercontent.com/glynnbird/usstatesgeojson/master/florida.geojson || rm -f trabalho/florida.geojson
      - name: Montar
        timeout-minutes: 55
        run: python -u -m scripts.longo.narrado tudo "scripts/longo/narrados/$EPISODIO.json"
      - name: Guardar no ramo
        if: always()
        run: |
          T="trabalho/narrado/$EPISODIO"; P="previas/longo/narrado/$EPISODIO"
          mkdir -p "$P"; rm -f "$P"/*
          cp "$T"/capa.jpg "$T"/descricao.txt "$T"/relatorio.json "$P"/ 2>/dev/null || true
          cp "$T"/$EPISODIO.ass "$P"/legenda.ass 2>/dev/null || true
          if [ -f "$T/$EPISODIO.mp4" ]; then
            ffmpeg -y -loglevel error -i "$T/$EPISODIO.mp4" -vf scale=1280:-2 -c:v libx264 -preset veryfast -crf 27 -c:a aac -b:a 128k -movflags +faststart "$P/previa-720p.mp4"
            split -b 90M -d "$T/$EPISODIO.mp4" "$P/final-1080p.mp4.parte"
            sha256sum "$T/$EPISODIO.mp4" > "$P/final-1080p.sha256"
          fi
          git config user.name "pixelzada-bot"
          git config user.email "bot@pixelzada.com.br"
          git add -f "$P"
          git diff --cached --quiet && exit 0
          git commit -q -m "longo narrado: prévia $EPISODIO [skip ci]"
          for i in 1 2 3 4; do git pull --rebase -q origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME" && exit 0; sleep $((i*5)); done
          exit 1
