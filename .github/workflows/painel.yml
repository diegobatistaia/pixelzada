name: Painel

# Monta o estado da Pixelzada para o Painel das marcas (pixelzada.com.br/painel/):
# Reels e carrosséis de hoje, fila de Reels, matérias do site, pesquisa,
# números do Instagram e falhas dos workflows. Código: scripts/social/painel.py.
#
# O resultado vai para o ramo painel-dados (estado.json + historico.json), e não
# para o main: assim o painel atualiza toda hora sem encher o histórico do site
# nem disputar o push com os outros robôs. A página lê o arquivo direto do GitHub.
on:
  schedule:
    - cron: "17 * * * *"   # de hora em hora
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: painel
  cancel-in-progress: false

jobs:
  painel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      INSTAGRAM_TOKEN_PIXELZADA: ${{ secrets.INSTAGRAM_TOKEN_PIXELZADA }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install --quiet pyyaml

      - name: Abrir o ramo painel-dados
        run: |
          mkdir painel-dados && cd painel-dados
          git init -q -b painel-dados
          git config user.name "pixelzada-bot"
          git config user.email "bot@pixelzada.com.br"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth 1 origin painel-dados; then
            git reset -q --hard FETCH_HEAD
          else
            echo "Ramo painel-dados ainda não existe; nasce nesta rodada."
          fi

      - name: Montar o estado
        run: python -m scripts.social.painel --saida painel-dados

      - name: Gravar no ramo painel-dados
        run: |
          cd painel-dados
          git add estado.json historico.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -qm "painel: $(TZ=America/Sao_Paulo date '+%d/%m %H:%M')"
          for tentativa in 1 2 3; do
            git push origin painel-dados && exit 0
            sleep $((tentativa * 5))
          done
          exit 1
