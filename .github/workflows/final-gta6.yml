name: Final do GTA 6 (material bruto)

# Diego, 21/11/2026: junta clipes mais vistos e o fim das lives gravadas de quem zerou o GTA 6,
# para montar à mão os Reels do final (exceção: moldura branca + "⚠️ SPOILER").
on:
  workflow_dispatch:
    inputs:
      canais:
        description: "Logins da Twitch separados por espaço"
        required: false
        default: "ishowspeed"
      desde:
        description: "Desde (AAAA-MM-DD, UTC)"
        required: false
        default: "2026-11-18"
      fim:
        description: "Minutos finais de cada live gravada"
        required: false
        default: "30"
      vod:
        description: "Opcional: id de uma live gravada para baixar em pedaços de 5 min (de/ate em segundos)"
        required: false
        default: ""
      trecho:
        description: "Com vod: 'de ate' em segundos, ex. 10000 14650"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  buscar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TWITCH_CLIENT_ID_PIXELZADA: ${{ secrets.TWITCH_CLIENT_ID_PIXELZADA }}
      TWITCH_CLIENT_SECRET_PIXELZADA: ${{ secrets.TWITCH_CLIENT_SECRET_PIXELZADA }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: |
          bash scripts/instalar_ffmpeg.sh
          pip install pyyaml yt-dlp "opencv-python-headless<5"
      - name: Buscar o final
        env:
          CANAIS: ${{ inputs.canais }}
          DESDE: ${{ inputs.desde }}
          FIM: ${{ inputs.fim }}
          VOD: ${{ inputs.vod }}
          TRECHO: ${{ inputs.trecho }}
        run: |
          if [ -n "$VOD" ]; then
            set -- $TRECHO
            python -m scripts.social.final_gta6 x --vod "$VOD" --de "$1" --ate "$2" --saida saida
          else
            python -m scripts.social.final_gta6 $CANAIS --desde "$DESDE" --fim "$FIM" --saida saida
          fi
      - name: Guardar na release final-gta6
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view final-gta6 -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create final-gta6 -R "$GITHUB_REPOSITORY" --prerelease --title "Final do GTA 6 (bruto)" \
              --notes "Material bruto para os Reels do final do GTA 6."
          for f in saida/*; do
            for t in 1 2 3; do gh release upload final-gta6 "$f" --clobber -R "$GITHUB_REPOSITORY" && break; sleep 5; done
          done
