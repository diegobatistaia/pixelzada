name: Twitch - gravar trechos de live só de jogo (vídeos longos)

# Disparo: criar/alterar scripts/longo/twitch.pedido com "<login> <minutos>" (ex.: "gta6news 20").
on:
  push:
    branches: ["claude/**"]
    paths: ["scripts/longo/twitch.pedido", ".github/workflows/twitch-gravar.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: twitch-gravar-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gravar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Ferramentas
        run: |
          pip install -q pillow yt-dlp
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
      - name: Gravar
        run: |
          read LOGIN MIN < scripts/longo/twitch.pedido
          python -u -m scripts.longo.twitch_gravar "$LOGIN" "previas/longo/_twitch/$LOGIN" "${MIN:-20}" 40 8
      - name: Guardar no ramo
        if: always()
        run: |
          git config user.name "pixelzada-bot"
          git config user.email "bot@pixelzada.com.br"
          git add -f previas/longo/_twitch || exit 0
          git diff --cached --quiet && exit 0
          git commit -q -m "longo: trechos gravados da Twitch [skip ci]"
          for i in 1 2 3 4; do { git pull --rebase -X theirs -q origin "$GITHUB_REF_NAME" || { git rebase --abort; false; }; } && git push -q origin "HEAD:$GITHUB_REF_NAME" && exit 0; sleep $((i*5)); done
