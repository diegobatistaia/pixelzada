name: Refazer cortes das lives

# Diego, 18/11: cortes da Twitch no formato dividido (câmera do streamer em cima, jogo
# embaixo, sem moldura). Refaz os cortes que já estão na fila e ainda não saíram
# (python -m scripts.social.lives refazer), confere nudez e grava a fila.
on:
  workflow_dispatch:
    inputs:
      link:
        description: "Só prévias: links de clipes da Twitch (separados por espaço), grava em social/reels/modelos/"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  refazer:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: ${{ inputs.link != '' && 'modelos' || 'montar' }}  # mexe na fila: nunca junto com a montagem
      cancel-in-progress: false
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_GRATIS }}  # SÓ a chave grátis; nunca a paga (Diego, 24/11)
      TWITCH_CLIENT_ID_PIXELZADA: ${{ secrets.TWITCH_CLIENT_ID_PIXELZADA }}
      TWITCH_CLIENT_SECRET_PIXELZADA: ${{ secrets.TWITCH_CLIENT_SECRET_PIXELZADA }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: |
          bash scripts/instalar_ffmpeg.sh
          pip install pyyaml yt-dlp "opencv-python-headless<5"
      - name: Prévias (modelos)
        if: inputs.link != ''
        env:
          LINK: ${{ inputs.link }}
        run: python -m scripts.social.lives modelo $LINK
      - name: Refazer no formato dividido
        if: inputs.link == ''
        run: python -m scripts.social.lives refazer
      - name: Checagem de nudez na fila
        if: inputs.link == ''
        run: python -m scripts.social.seguranca varrer
      - name: Registrar
        if: always()
        run: |
          git config user.name "pixelzada-bot"
          git config user.email "bot@pixelzada.com.br"
          git add -A social/reels
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "reels: cortes das lives no formato dividido $(TZ=America/Sao_Paulo date '+%d/%m %H:%M')"
          for tentativa in 1 2 3 4; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((tentativa * 4))
          done
          exit 1
