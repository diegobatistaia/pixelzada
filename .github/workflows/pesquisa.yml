name: Pesquisa de vídeos

# Motor de pesquisa de vídeos dos concorrentes (scripts/social/pesquisa.py).
# Todo dia às 6h (Brasília) lê os perfis concorrentes pela API oficial do
# Instagram e grava a lista do dia em social/pesquisa/listas/. A partir do
# lançamento do GTA 6 (19/11) coleta também às 11h, 15h e 19h. Os horários que
# valem estão em social/pesquisa/config.yaml; as rodadas fora deles não fazem nada.
#
# Botão "Run workflow":
#   teste    confere a chave (secret META_TOKEN_PIXELZADA) e lê 1 perfil
#   coletar  faz a coleta e a lista agora, fora do horário
#   baixar   baixa os vídeos escolhidos: data (AAAA-MM-DD) + números (ex.: 1,4,7)
#   completar  roda o piso agora (baixa, monta e agenda o que faltar)
#   link     baixa e monta o Reel de um link que o Diego mandou
#   lives    pega agora os clipes de GTA 6 mais vistos da Twitch/Kick (scripts/social/lives.py)
#   lives-teste  ensaio com outro jogo (campo link = nome do jogo na Twitch; padrão GTA 5),
#            sem pôr na fila; resultado em social/pesquisa/lives-teste.json
#
# PISO DOS 6 REELS POR DIA: toda rodada (agendada ou não) confere a fila de hoje
# e dos próximos 2 dias; se faltar vídeo, baixa sozinho os melhores da lista
# (scripts/social/pesquisa.py completar) e o job "montar" põe na identidade e
# agenda (scripts/social/montagem.py). Ninguém precisa responder nada.
on:
  schedule:
    - cron: "5,35 9 * * *"     # 6h
    - cron: "5,35 14 * * *"    # 11h (só no lançamento)
    - cron: "5,35 18 * * *"    # 15h (só no lançamento)
    - cron: "5,35 22 * * *"    # 19h (só no lançamento)
    # Pico do lançamento do GTA 6 (18 a 22/11): de 30 em 30 minutos, 24h por dia.
    - cron: "5,35 * 18-22 11 *"
    - cron: "5,35 0-2 23 11 *"  # 22/11 das 21h às 23h35 de Brasília
  workflow_dispatch:
    inputs:
      acao:
        description: "teste, coletar ou baixar"
        type: choice
        options: [teste, coletar, baixar, completar, link, lives, lives-teste]
        default: teste
      data:
        description: "baixar: data da lista (AAAA-MM-DD)"
        required: false
      numeros:
        description: "baixar: números da lista (ex.: 1,4,7)"
        required: false
      link:
        description: "link: endereço do Reel que o Diego mandou (pode ser vários, separados por espaço)"
        required: false

permissions:
  contents: write
  models: read      # GitHub Models escreve o título do Reel (montagem.py)

concurrency:
  group: pesquisa
  cancel-in-progress: false

jobs:
  pesquisa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      META_TOKEN_PIXELZADA: ${{ secrets.META_TOKEN_PIXELZADA }}
      ACAO: ${{ github.event.inputs.acao || 'agendada' }}
      DATA: ${{ github.event.inputs.data }}
      NUMEROS: ${{ github.event.inputs.numeros }}
      LINK: ${{ github.event.inputs.link }}
      TWITCH_CLIENT_ID_PIXELZADA: ${{ secrets.TWITCH_CLIENT_ID_PIXELZADA }}
      TWITCH_CLIENT_SECRET_PIXELZADA: ${{ secrets.TWITCH_CLIENT_SECRET_PIXELZADA }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install pyyaml yt-dlp "opencv-python-headless<5"

      - name: Teste da chave
        if: env.ACAO == 'teste'
        run: python -m scripts.social.pesquisa teste

      - name: Coleta agendada
        if: env.ACAO == 'agendada'
        run: python -m scripts.social.pesquisa coletar

      - name: Coleta agora
        if: env.ACAO == 'coletar'
        run: python -m scripts.social.pesquisa coletar --forcar

      - name: Baixar os escolhidos
        if: env.ACAO == 'baixar'
        run: python -m scripts.social.pesquisa baixar "$DATA" "$NUMEROS"

      - name: Baixar o vídeo do link
        if: env.ACAO == 'link'
        run: python -m scripts.social.pesquisa link "$LINK"

      # Cortes das lives (lançamento do GTA 6): só age de 18/11 8h a 22/11 (config.yaml, bloco lives).
      - name: Clipes das lives (Twitch e Kick)
        continue-on-error: true   # se a Twitch falhar, o piso de Reels segue
        if: env.ACAO == 'agendada' || env.ACAO == 'completar' || env.ACAO == 'lives' || env.ACAO == 'lives-teste'
        run: |
          command -v ffmpeg > /dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null)
          case "$ACAO" in
            lives) python -m scripts.social.lives rodada --forcar ;;
            lives-teste) python -m scripts.social.lives teste "${LINK:-Grand Theft Auto V}" ;;
            *) python -m scripts.social.lives rodada ;;
          esac

      - name: Piso dos 6 Reels por dia (baixa o que faltar)
        if: env.ACAO != 'teste' && env.ACAO != 'baixar' && env.ACAO != 'link' && env.ACAO != 'lives-teste'
        run: python -m scripts.social.pesquisa completar

      - name: Registrar o resultado
        if: always() && env.ACAO != 'teste'
        run: |
          git config user.name "pixelzada-bot"
          git config user.email "bot@pixelzada.com.br"
          git add -A social/pesquisa
          if [ -d social/reels/entrada ]; then git add -A social/reels/entrada; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "pesquisa: $ACAO $(TZ=America/Sao_Paulo date '+%d/%m %H:%M')"
          for tentativa in 1 2 3 4; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((tentativa * 4))
          done
          exit 1

  # Monta na identidade e agenda tudo o que caiu em social/reels/entrada/
  # (workflow reutilizável montar.yml, o mesmo que o robô do Telegram usa).
  montar:
    needs: pesquisa
    if: always() && github.event.inputs.acao != 'teste'
    uses: ./.github/workflows/montar.yml
